
services:
  postgres-test:
    image: postgres:17.4

    environment:
      POSTGRES_USER: casajugos_test
      POSTGRES_PASSWORD: "${PG_TEST_PASSWORD:?Define PG_TEST_PASSWORD}"
      POSTGRES_DB: casajugos_test

    ports:
      - "127.0.0.1:55433:5432"

    # Almacenamiento temporal, independiente del PostgreSQL actual.
    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U casajugos_test -d casajugos_test"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
